# App-owned test pipeline. Matches .github/workflows/test.yml.
# Project CI config path must be `.gitlab-ci.yml` (not the infra-layer template).
# Image publish / cluster deploy stays with DevOps (registry, runners, Ingress).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NEXT_PUBLIC_FAST_API: "http://localhost:8000"
  NEXT_PUBLIC_URL: "http://localhost:3000"
  CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/.cache/Cypress"

default:
  interruptible: true

.test_rules: &test_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - .cache/Cypress/

test-nextjs:
  stage: test
  image: node:22-bookworm
  rules: *test_rules
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
        libgtk-3-0 libgbm1 libnotify4 libnss3 libxss1 libasound2
        libxtst6 xauth xvfb libatomic1
  script:
    - npm ci
    - npm test
    - npm run check:i18n-copy
    - npm run typecheck
    - npm run lint
    - npm run deadcode
    - npm run build
    - npx cypress run --component --browser electron
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - cypress/screenshots/
      - cypress/videos/

